# Local stack: builds the image from this checkout and routes it through
# gluetun, so the app's traffic leaves via ProtonVPN exactly as it would on the
# NAS. Nothing here is Synology specific.
#
# Before the first run, put your WireGuard config in place:
#   docker-data/gluetun/wireguard/wg0.conf
# Gluetun insists on that filename, so a config downloaded as
# libgen-FI-13.conf has to be copied there under the name wg0.conf.
#
#   docker compose -f docker-compose.local.yml up -d --build
#   http://localhost:8095
#
# Downloads land on the T9 at D:/Papers/inbox, where the RAG corpus sync picks
# them up. LIBGEN_VOLUME_MARKER names a file that only the real disk carries: an
# unplugged removable drive leaves Docker free to create an empty, writable
# bind-mount target, and without the marker the app would download into it and
# lose the lot. Unset the variable to turn the check off.
#
# The queue database stays on C: under ./docker-data - D: is exFAT, which has no
# advisory locking SQLite can rely on through a bind mount.
#
# If the UI shows the "missing its .libgen-volume marker" banner, WSL2 has not
# mounted the T9. It only picks up removable drives that were attached when it
# started, and Docker then quietly creates an empty stand-in directory rather
# than failing - which is the whole reason the marker check exists. Confirmed
# with `docker exec libgen-downloader grep /downloads /proc/mounts`: a working
# mount reads `D: /downloads 9p ... drvfs`, a phantom one reads `/dev/sde ext4`.
# Fix it by restarting Docker Desktop with the drive plugged in, or immediately
# with:
#
#   wsl -d docker-desktop -e mount -t drvfs D: /mnt/host/d
#   docker compose -f docker-compose.local.yml up -d --force-recreate libgen-downloader
#
# The queue holds its items throughout and drains on its own once the disk is
# back, so nothing is lost either way.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: libgen-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - TZ=Europe/London
      # Subnets reachable WITHOUT going through the tunnel. Needed to reach
      # anything on the LAN - the research corpus for LIBGEN_CORPUS_URL, a NAS
      # share, a local Ollama. Verified against gluetun's own settings dump:
      # the name is FIREWALL_OUTBOUND_SUBNETS. `NET_LOCAL` is NOT a gluetun
      # setting and is silently ignored, which leaves every LAN address
      # unreachable while looking configured.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-192.168.1.0/24}
      # DNS-over-TLS left on deliberately: name resolution then travels inside
      # the tunnel, which is what defeats an ISP intercepting libgen lookups.
    volumes:
      - ./docker-data/gluetun:/gluetun
    ports:
      - 8095:8095 # libgen-downloader web UI, published here because the app
        # shares this container's network namespace
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped

  libgen-downloader:
    build: .
    container_name: libgen-downloader
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - LIBGEN_PORT=8095
      - LIBGEN_VOLUME_MARKER=.libgen-volume
      # A library service that can say which results are already held, so the UI
      # marks them before you download a second copy. Unset means the UI simply
      # does not show that.
      #
      # Use the host's LAN address, e.g. http://192.168.1.50:8000 - NOT
      # localhost (which is gluetun's, since this container shares its network
      # namespace) and NOT host.docker.internal: Docker refuses extra_hosts
      # alongside `network_mode: service:`, so that name cannot be mapped here.
      # A private-range address works despite the VPN because gluetun's
      # NET_LOCAL keeps those subnets off the tunnel.
      - LIBGEN_CORPUS_URL=${LIBGEN_CORPUS_URL:-}
    volumes:
      - ./docker-data/config:/config
      - D:/Papers/inbox:/downloads
    restart: unless-stopped
