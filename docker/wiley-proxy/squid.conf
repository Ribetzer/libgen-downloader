# A proxy outside the VPN for Wiley only: its TDM API (api.wiley.com) and the
# host it redirects the download to.
#
# Cloudflare in front of Wiley's text-and-data-mining API refuses VPN exit
# IPs outright, so those requests - the publisher's own API, called with the
# account's own token - go out over the ordinary connection instead. Every
# other destination is refused here, so nothing else can leave outside the
# VPN by accident.
http_port 3128

acl lanes src 172.30.0.0/24
# The API answers with a redirect to alm.wiley.com, which serves the file.
acl wiley dstdomain .wiley.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow lanes wiley
http_access deny all

cache deny all
# Squid runs as its own user, which cannot write the container's stdout.
access_log none
cache_log /var/log/squid/cache.log
pid_filename none
